services:
  backend:
    build: .
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - WIKIPEDIA_HEADERS=${WIKIPEDIA_HEADERS}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
    volumes:
      - chroma-data:/app/chromadb.db

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}

volumes:
  chroma-data:
