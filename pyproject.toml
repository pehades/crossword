[project]
name = "crossword"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "oikonomod", email = "oikonomod@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "guardrails-ai>=0.11.0",
    "langchain>=1.4.3",
    "langchain-nebius>=0.1.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "tavily>=1.1.0",
]

[project.scripts]
crossword = "crossword.main:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
